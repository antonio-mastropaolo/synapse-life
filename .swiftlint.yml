disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - literal_expression_end_indentation
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

excluded:
  - .build
  - DerivedData
  - Packages
  - SynapseLife.xcodeproj

line_length:
  warning: 110
  error: 140
  ignores_comments: true
  ignores_urls: true

identifier_name:
  excluded:
    - id
    - r
    - g
    - b
    - n
    - k
    - v
    - x
    - q

force_unwrapping:
  severity: error

force_cast:
  severity: error
