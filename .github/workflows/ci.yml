name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  package-tests:
    name: SwiftPM test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Swift version
        run: swift --version

      - name: Build & test SynnapseKit
        run: swift test --package-path packages/SynnapseKit -v

  app-builds:
    name: xcodebuild — macOS + iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build SynnapseMac
        run: |
          xcodebuild \
            -project Synnapse.xcodeproj \
            -scheme SynnapseMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build SynnapseiOS for simulator
        run: |
          xcodebuild \
            -project Synnapse.xcodeproj \
            -scheme SynnapseiOS \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
