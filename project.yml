name: SynapseLife
options:
  bundleIdPrefix: tech.synapse.life
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  SynapseLifeKit:
    path: packages/SynapseLifeKit

targets:
  SynapseLifeMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - apps/SynapseLife-macOS
      - apps/Shared
    dependencies:
      - package: SynapseLifeKit
        product: DesignSystem
      - package: SynapseLifeKit
        product: Networking
      - package: SynapseLifeKit
        product: Auth
      - package: SynapseLifeKit
        product: Models
      - package: SynapseLifeKit
        product: Persistence
      - package: SynapseLifeKit
        product: Features
      - package: SynapseLifeKit
        product: AppLifecycle
    settings:
      base:
        PRODUCT_NAME: SynapseLife
        PRODUCT_BUNDLE_IDENTIFIER: tech.synapse.life.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/SynapseLife-macOS/SynapseLife-macOS.entitlements
        DEVELOPMENT_TEAM: WCGJPF9TWU
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_NSHumanReadableCopyright: "(c) 2026 Antonio Mastropaolo"
        INFOPLIST_KEY_CFBundleDisplayName: Synapse Life
        INFOPLIST_KEY_CFBundleName: SynapseLife
        # Touch ID on Macs that have it unlocks the financial surfaces via
        # the shared BiometricGate. The string is required or the system
        # biometric sheet refuses to present.
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Synapse uses Touch ID to unlock your financial data so only you can see it."
        # The app talks to its backend over standard HTTPS (TLS) only and
        # ships no custom or proprietary cryptography, so it qualifies for
        # the export-compliance exemption. Declaring this here suppresses
        # the per-upload export-compliance prompt.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SynapseLifeiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - apps/SynapseLife-iOS
      - apps/Shared
    dependencies:
      - package: SynapseLifeKit
        product: DesignSystem
      - package: SynapseLifeKit
        product: Networking
      - package: SynapseLifeKit
        product: Auth
      - package: SynapseLifeKit
        product: Models
      - package: SynapseLifeKit
        product: Persistence
      - package: SynapseLifeKit
        product: Features
      - package: SynapseLifeKit
        product: AppLifecycle
    # Explicit Info.plist so the Phase 4 background-refresh task can declare
    # its permitted identifier (no INFOPLIST_KEY_ build-setting form exists for
    # BGTaskSchedulerPermittedIdentifiers). Because this is an explicit plist
    # (not GENERATE_INFOPLIST_FILE), Apple-required keys that would otherwise
    # ride in via INFOPLIST_KEY_* build settings have to be written here
    # directly — hence the usage string, export-compliance flag, and app
    # category live in this block.
    info:
      path: apps/SynapseLife-iOS/Info.plist
      properties:
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [tech.synapse.life.refresh.proactive]
        # Finance app, not productivity — drives App Store category and the
        # Mac/iOS Launchpad grouping.
        LSApplicationCategoryType: public.app-category.finance
        # Face ID unlocks the financial surfaces via the shared
        # BiometricGate. Required or the system biometric sheet refuses
        # to present and the unlock flow crashes on Face ID devices.
        NSFaceIDUsageDescription: "Synapse uses Face ID to unlock your financial data so only you can see it."
        # Standard HTTPS (TLS) transport only, no custom cryptography, so
        # the app qualifies for the export-compliance exemption. Suppresses
        # the per-upload export-compliance prompt.
        ITSAppUsesNonExemptEncryption: false
        # An explicit (empty) launch-screen dict gives a clean system-drawn
        # launch surface. The INFOPLIST_KEY_UILaunchScreen_Generation build
        # setting does not apply to an explicit Info.plist, so the key has
        # to live here or the app falls back to a legacy launch mode.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: SynapseLife
        PRODUCT_BUNDLE_IDENTIFIER: tech.synapse.life.ios
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/SynapseLife-iOS/SynapseLife-iOS.entitlements
        DEVELOPMENT_TEAM: WCGJPF9TWU
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: "(c) 2026 Antonio Mastropaolo"
        INFOPLIST_KEY_CFBundleDisplayName: Synapse Life
        INFOPLIST_KEY_CFBundleName: SynapseLife
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
