name: Synnapse
options:
  bundleIdPrefix: tech.synnapse
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

packages:
  SynnapseKit:
    path: packages/SynnapseKit

targets:
  SynnapseMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - apps/Synnapse-macOS
      - apps/Shared
    dependencies:
      - package: SynnapseKit
        product: DesignSystem
      - package: SynnapseKit
        product: Networking
      - package: SynnapseKit
        product: Auth
      - package: SynnapseKit
        product: Models
      - package: SynnapseKit
        product: Persistence
      - package: SynnapseKit
        product: Features
      - package: SynnapseKit
        product: AppLifecycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synnapse.mac
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/Synnapse-macOS/Synnapse-macOS.entitlements
        DEVELOPMENT_TEAM: WCGJPF9TWU
        ENABLE_HARDENED_RUNTIME: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "(c) 2026 Antonio Mastropaolo"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SynnapseiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - apps/Synnapse-iOS
      - apps/Shared
    dependencies:
      - package: SynnapseKit
        product: DesignSystem
      - package: SynnapseKit
        product: Networking
      - package: SynnapseKit
        product: Auth
      - package: SynnapseKit
        product: Models
      - package: SynnapseKit
        product: Persistence
      - package: SynnapseKit
        product: Features
      - package: SynnapseKit
        product: AppLifecycle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.synnapse.ios
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: apps/Synnapse-iOS/Synnapse-iOS.entitlements
        DEVELOPMENT_TEAM: WCGJPF9TWU
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_NSHumanReadableCopyright: "(c) 2026 Antonio Mastropaolo"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
